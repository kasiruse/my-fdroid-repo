name: Update F-Droid Repo

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install F-Droid & Java Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver default-jdk-headless wget

      - name: Download Approved APKs
        run: |
          mkdir -p repo
          # دانلود یک APK نمونه برای تست ساخت مخزن (میتوانید این لینک را با برنامه دلخواه عوض کنید)
          wget -O repo/fdroid-client.apk "https://f-droid.org/F-Droid.apk"

      - name: Build F-Droid Index
        run: |
          if [ ! -f "config.yml" ]; then
            fdroid init --bare
          fi
          fdroid update --create-metadata

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3.1.1
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
